# Для проксирования WebSocket: заголовок Connection должен быть "upgrade" только
# у апгрейд-запросов, у обычных HTTP — "close".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Кириллица в JSON-ответах и HTML
    charset utf-8;

    # Загрузка аватаров и файлов
    client_max_body_size 20m;

    # ── API: тот же origin, что и страница ───────────────────────────────────
    # Поэтому CORS не участвует вообще, и адрес бэкенда не «зашит» в сборку:
    # браузер зовёт /api/v1/..., nginx передаёт на контейнер backend.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket принтеров: /api/v1/printers/ws/{branch_id}
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── WebSocket кухни (живые заказы) ───────────────────────────────────────
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Swagger бэкенда — чтобы проверять API с того же адреса
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # ── HQ-админка (видит все компании) — НЕ на предсказуемом /admin, см.
    #    ../nginx/conf.d/ssl.conf (прод) для того же секретного пути. ────────
    location = /8ZoR0CHUJbLSPXjWbHp9DLWnHJQkUm59 {
        try_files /admin.html =404;
    }

    # admin.html физически лежит в том же dist/ — без явного запрета
    # location / отдала бы его напрямую по старому предсказуемому пути.
    location = /admin.html {
        return 404;
    }
    location = /admin {
        return 404;
    }

    # ── Кухня (отдельный KDS-экран поваров, вне админки) ───────────────────
    location = /kitchen.html {
        try_files /kitchen.html =404;
    }
    location /kitchen {
        try_files /kitchen.html =404;
    }

    # ── ТВ-экран посетителей: /tv?branch=<uuid> (без логина) ──────────────
    location = /tv {
        try_files /tv.html =404;
    }
    location = /tv/ {
        try_files /tv.html =404;
    }
    location = /tv.html {
        try_files /tv.html =404;
    }

    # ── Экран раздачи: /expo (вход по телефону и паролю, право can_expo) ───
    location = /expo {
        try_files /expo.html =404;
    }
    location = /expo/ {
        try_files /expo.html =404;
    }
    location = /expo.html {
        try_files /expo.html =404;
    }

    # ── SPA: любые внутренние маршруты отдаём index.html ────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статика с длинным кэшем (файлы Vite содержат хэш в имени)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
