<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Тема гостя применяется до первой отрисовки, чтобы не было вспышки светлого экрана.
      (function () {
        try {
          var theme = localStorage.getItem("marjon_qm_theme");
          if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#f3f7f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1216" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/marjon-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Меню</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/qrmenu/main.jsx"></script>
  </body>
</html>
