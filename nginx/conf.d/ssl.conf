# Включается ПОСЛЕ первого успешного certbot certonly (см. ../README.md).
# Тогда: переименовать этот файл в ssl.conf, заменить "location /" на
# редирект в default.conf / admin.conf / storage.conf / payments.conf,
# перезапустить nginx.
#
# Один SAN-сертификат на все домены (certbot -d marjon.tech -d www.marjon.tech
# -d api.marjon.tech -d admin.marjon.tech -d s3.marjon.tech
# -d minio.marjon.tech -d payme.marjon.tech -d click.marjon.tech
# -d uzum.marjon.tech выдаёт его в /etc/letsencrypt/live/marjon.tech/) —
# поэтому все server-блоки ниже ссылаются на один и тот же путь.

# ── Общие SSL-параметры (map в отдельный файл, чтобы не повторять в каждом
#    server-блоке) ──────────────────────────────────────────────────────
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# Тот же смысл, что default_server в default.conf (порт 80) — wildcard-DNS
# резолвит любой поддомен сюда, этот блок ловит незнакомые Host и молча
# рвёт соединение вместо показа лендинга/админки первому попавшемуся.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/marjon.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marjon.tech/privkey.pem;
    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name marjon.tech www.marjon.tech;

    ssl_certificate     /etc/letsencrypt/live/marjon.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marjon.tech/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    add_header Cache-Control "public, max-age=300";
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.marjon.tech;

    ssl_certificate     /etc/letsencrypt/live/marjon.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marjon.tech/privkey.pem;

    resolver 127.0.0.11 valid=10s;
    client_max_body_size 25m;

    location / {
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        include /etc/nginx/snippets/proxy-common.conf;
        include /etc/nginx/snippets/proxy-websocket.conf;
        proxy_read_timeout 90s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.marjon.tech;

    ssl_certificate     /etc/letsencrypt/live/marjon.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marjon.tech/privkey.pem;

    root /usr/share/nginx/html-admin;
    index index.html;

    # Главная HQ-админка (platform admin, видит все компании) — НЕ на
    # предсказуемом /admin: кто угадает путь ниже, получит её прямо с
    # логин-формы. Сам admin.html не использует client-side роутинг
    # (нет react-router в src/admin/), так что просто отдаём файл как есть —
    # никаких правил $uri/подстраниц под этим путём не нужно.
    # Сменить секретный путь — отредактировать только эту строку.
    location = /8ZoR0CHUJbLSPXjWbHp9DLWnHJQkUm59 {
        try_files /admin.html =404;
    }

    # admin.html физически лежит в том же dist/, что и index.html (общая
    # мультистраничная сборка Vite) — без явного запрета location / отдала бы
    # его напрямую по старому предсказуемому пути (try_files сначала смотрит,
    # существует ли файл на диске, и секретный location выше тут ни при чём).
    location = /admin.html {
        return 404;
    }
    location = /admin {
        return 404;
    }

    # Установщики десктопа и манифест для страницы /store. Отдельный том
    # (./store-files), а не dist/: пересборка фронта стирает dist целиком,
    # установщики терять нельзя.
    location /store/files/ {
        alias /usr/share/nginx/store/;
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
    }

    # Короткий адрес кухонного экрана для поваров: admin.marjon.tech/kds.
    # Отдаём отдельный entry kitchen.html (свой бандл), а не SPA админки —
    # повар не должен попадать в интерфейс владельца.
    location = /kds {
        try_files /kitchen.html =404;
    }
    location = /kds/ {
        try_files /kitchen.html =404;
    }

    # ТВ-экран для посетителей: admin.marjon.tech/tv?branch=<uuid>.
    # Публичная страница без логина — телевизор в зале не авторизуется.
    location = /tv {
        try_files /tv.html =404;
    }
    location = /tv/ {
        try_files /tv.html =404;
    }
    location = /tv.html {
        try_files /tv.html =404;
    }

    # Владельцы (обычная кафе/POS-панель) — дефолт на этом домене.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    add_header Cache-Control "no-cache";
}

