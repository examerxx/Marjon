# Старое имя кабинета. Оставлено, пока сертификат выписан и на него:
# пользователей уводим на admin.marjon.tech, чтобы закладки не ломались.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adminka.marjon.tech;

    ssl_certificate     /etc/letsencrypt/live/marjon.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marjon.tech/privkey.pem;

    return 301 https://admin.marjon.tech$request_uri;
}
